name: CI

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }} / Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            nest: 10
            express: 4
          - node: 24
            nest: 11
            express: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm 11 discards packages passed to `npm install --no-save` when they
      # are not declared in package.json, so the optional peers are saved
      # into the disposable CI checkout instead.
      - name: Install compatibility versions
        run: |
          npm install --save-dev --no-package-lock \
            @nestjs/common@${{ matrix.nest }} \
            @nestjs/core@${{ matrix.nest }} \
            @nestjs/testing@${{ matrix.nest }} \
            @nestjs/platform-express@${{ matrix.nest }} \
            express@${{ matrix.express }} \
            @types/express@${{ matrix.express }} \
            class-validator \
            class-transformer
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run pack:check
